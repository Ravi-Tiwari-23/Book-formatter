[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truelogger-book"
version = "0.1.0"
description = "Reference-based Hindi/English PDF validation and book production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "pytesseract>=0.3.13,<1",
  "rapidfuzz>=3.9,<4",
  "streamlit[pdf]>=1.57,<2",
  "weasyprint>=62,<70",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.10,<5"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

